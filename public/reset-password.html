<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>איפוס סיסמה — לוח וסתות</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-container" style="margin-top:3rem;">
    <h1 class="auth-title">לוח וסתות</h1>
    <h2>איפוס סיסמה</h2>
    <form id="reset-form" class="auth-form">
      <div class="form-group">
        <label for="reset-password">סיסמה חדשה</label>
        <input type="password" id="reset-password" required minlength="8" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="reset-confirm">אימות סיסמה</label>
        <input type="password" id="reset-confirm" required autocomplete="new-password">
      </div>
      <div id="reset-warning" style="display:none; background:#FFF3E0; padding:0.75rem; border-radius:8px; margin:1rem 0; border-right:4px solid #FF9800; font-size:0.85rem;">
        <strong>שים לב:</strong> חשבונך במצב E2E. איפוס הסיסמה ימחק את כל הנתונים. לא ניתן לשחזר.
        <label style="display:block; margin-top:0.5rem;"><input type="checkbox" id="confirm-data-loss"> אני מבין/ה שהנתונים יימחקו</label>
      </div>
      <div id="reset-error" class="error-message"></div>
      <div id="reset-success" class="success-message"></div>
      <button type="submit" class="btn btn-primary">איפוס סיסמה</button>
    </form>
  </div>
  <script>
    var token = new URLSearchParams(window.location.search).get('token');
    document.getElementById('reset-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var password = document.getElementById('reset-password').value;
      var confirm = document.getElementById('reset-confirm').value;
      var errorEl = document.getElementById('reset-error');
      var successEl = document.getElementById('reset-success');
      errorEl.textContent = ''; successEl.textContent = '';
      if (password !== confirm) { errorEl.textContent = 'הסיסמאות אינן תואמות'; return; }
      if (password.length < 8) { errorEl.textContent = 'סיסמה חייבת להכיל לפחות 8 תווים'; return; }
      var body = { token: token, password: password };
      var checkbox = document.getElementById('confirm-data-loss');
      if (checkbox) body.confirmDataLoss = checkbox.checked;
      fetch('/api/auth/reset-password', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) })
        .then(function(r) { return r.json().then(function(d) { return {ok:r.ok, data:d}; }); })
        .then(function(r) {
          if (r.data.requireConfirm) {
            document.getElementById('reset-warning').style.display = 'block';
            errorEl.textContent = 'יש לאשר מחיקת נתונים';
          } else if (r.ok) {
            successEl.textContent = r.data.message + ' — מעבר לכניסה...';
            setTimeout(function() { window.location.href = '/'; }, 2000);
          } else {
            errorEl.textContent = r.data.error;
          }
        });
    });
  </script>
</body>
</html>
